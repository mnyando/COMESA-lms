version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: comesa_lms_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comesa_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comesa_lms"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comesa_lms_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/comesa_lms?schema=public"
      NEXTAUTH_SECRET: "comesa-secret-key-change-in-prod-12345"
      NEXTAUTH_URL: "http://localhost:3000"
      STORAGE_DIR: "/app/storage"
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
